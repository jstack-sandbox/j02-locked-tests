name: jstack-lock
run-name: lock replay ${{ inputs.commit }}
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
      commit:
        required: true
      planted:
        required: true
permissions: {}
jobs:
  replay:
    name: replay
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: exit 0
      - name: report every planted bug caught
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          cat > tests.json <<'REPLAY'
          [{"name":"CONTACT-001/E1 saves a contact","bugs":[{"bug":"save-dropped","result":"caught"}]},{"name":"CONTACT-001/F1 refuses an empty name","bugs":[{"bug":"name-not-required","result":"caught"}]},{"name":"CONTACT-001/E2 contact card shows name and email","bugs":[{"bug":"card-omits-email","result":"caught"}]},{"name":"CONTACT-002/F2 workspace B never sees a workspace A contact","bugs":[{"bug":"workspace-filter-removed","result":"caught"}]},{"name":"CONTACT-003/E1 stores the contact's workspace","bugs":[{"bug":"workspace-not-stored","result":"caught"}]},{"name":"CONTACT-004/E1 refuses a malformed email","bugs":[{"bug":"email-validation-accepts-double-at","result":"caught"}]},{"name":"CONTACT-004/E2 refuses a duplicate email","bugs":[{"bug":"duplicate-email-allowed","result":"caught"}]},{"name":"CONTACT-005/E1 phone number is optional","bugs":[{"bug":"phone-required","result":"caught"}]}]
          REPLAY
          jq --arg commit "$COMMIT" '{commit: $commit, tests: ., ran: [.[].name]}' tests.json > lock-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: lock-replay
          path: lock-replay.json
