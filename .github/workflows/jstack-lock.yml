name: jstack-lock
run-name: lock replay ${{ inputs.commit }}
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
      commit:
        required: true
      planted:
        required: true
permissions: {}
jobs:
  replay:
    name: replay
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: exit 0
      - name: report every planted bug caught
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          cat > tests.json <<'REPLAY'
          [{"name":"an operator saves a contact named Dana Ruiz","bugs":[{"bug":"save-dropped","result":"caught"}]},{"name":"a contact with an empty name is refused","bugs":[{"bug":"name-not-required","result":"caught"}]},{"name":"the contact card shows the name and email","bugs":[{"bug":"card-omits-email","result":"caught"}]},{"name":"workspace B never sees a workspace A contact","bugs":[{"bug":"workspace-filter-removed","result":"caught"}]},{"name":"a saved contact stores the operator's workspace","bugs":[{"bug":"workspace-not-stored","result":"caught"}]},{"name":"an email such as a@@b.com is refused","bugs":[{"bug":"email-validation-accepts-double-at","result":"caught"}]},{"name":"a second contact with the same email is refused","bugs":[{"bug":"duplicate-email-allowed","result":"caught"}]},{"name":"a contact saved with no phone is kept","bugs":[{"bug":"phone-required","result":"caught"}]}]
          REPLAY
          jq --arg commit "$COMMIT" '{commit: $commit, tests: ., ran: [.[].name]}' tests.json > lock-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: lock-replay
          path: lock-replay.json
